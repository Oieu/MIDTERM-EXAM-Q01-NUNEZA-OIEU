<!DOCTYPE html>
<html>
    <head>
        <title>Travel Itenary System0</title>

         <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

       
        .form-container, .search-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        
        input[type="text"], 
        input[type="date"], 
        input[type="number"] {
            padding: 10px 14px;
            border: 1px solid #ccd1d9;
            border-radius: 4px;
            font-size: 14px;
            flex: 1;
            min-width: 160px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

      
        button[onclick="addActivity()"] {
            background-color: #2ecc71;
            color: white;
        }
        button[onclick="addActivity()"]:hover { background-color: #27ae60; }

        button[onclick="loadActivity()"] {
            background-color: #3498db;
            color: white;
        }
        button[onclick="loadActivity()"]:hover { background-color: #2980b9; }

        button[onclick="findActivity()"] {
            background-color: #9b59b6;
            color: white;
        }
        button[onclick="findActivity()"]:hover { background-color: #8e44ad; }

        
        #itenaryList button {
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }
        #itenaryList button:hover { background-color: #c0392b; }

       
        #actDetails {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
            font-style: italic;
        }
        #actDetails:empty {
            display: none;
        }

    
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background-color: #34495e;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

       
    </style>

    </head>

    <body>
        <input
        type="text"
        id="activity"
        placeholder="Enter Activity Name"
    >

    <input
        type="text"
        id="location"
        placeholder="Enter Activity Location"
    >

        <input
        type="text"
        id="category"
        placeholder="Enter Category"
    >

    <input
        type="date"
        id="date"
        placeholder="Enter Activity Date"
    >


    <input
        type="text"
        id="start_time"
        placeholder="Enter Start Time"
    >

    <button onclick="addActivity()">
        AddActivity
    </button>

    <button onClick = "loadActivity()">
        Load Activities
    </button>

    <input 
        type="number"
        id="Activityid"
        placeholder="Enter ACtivity ID"
    >
    <button onclick="findActivity()">
            FindID
    </button>

    <p id = "actDetails"></p>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Start Time</th>
                <th>Activity</th>
                <th>Location</th>
                <th>Category</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="itenaryList">

        </tbody>
    </table>
        

    </body>

    

</html>


<script>
    
async function loadActivity() {
    
    const response = await fetch("/api/activities");
  
    const activities = await response.json(); 
    
   
    const actDetails = document.getElementById("itenaryList");
    actDetails.innerHTML = ""; 

    
    activities.forEach(activity => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${activity.date}</td>
            <td>${activity.start_time}</td>
            <td>${activity.activity}</td>
            <td>${activity.location}</td>
            <td>${activity.category}</td>
            <td>
                <button onClick=deleteActivity(${activity.id})>Delete</button>
            </td>
        `;
        
        actDetails.appendChild(row);
    });

    

}

    async function findActivity() {
        const id = document.getElementById("Activityid").value
        const actDetails = document.getElementById("actDetails");


        actDetails.textContent = "";

        const response = await fetch(`/api/activities/${id}`);
        const activity = await response.json();
        
        actDetails.textContent = `The Activity is ${activity.activity}, the location is ${activity.location}, the date is ${activity.date}
                                the start time is ${activity.start_time} and the category is ${activity.category}`


    }

        async function  addActivity() {
        
        const activity = document.getElementById("activity").value;
        const location = document.getElementById("location").value;
        const category = document.getElementById("category").value;
        const date = document.getElementById("date").value;
        const start_time = document.getElementById("start_time").value;

            const itenary = {
                activity, location, category, date, start_time
            };


            const response = await fetch("/api/activities", {
                    method: "POST",
                    headers: {"Content-Type" : "application/json"},
                    body: JSON.stringify(itenary)
            });
            
              if (response.ok) {
                     alert("Activity added successfully!");
            
            
                    document.getElementById("activity").value = "";
                    document.getElementById("location").value = "";
                    document.getElementById("category").value = "";
                    document.getElementById("date").value = "";
                    document.getElementById("start_time").value = "";

            
            loadActivity();

        }
}

async function deleteActivity(id) {
    
    if (!confirm("Are you sure you want to delete this activity?")) {
        return; 
    }

    try {
        const response = await fetch(`/api/activities/${id}`, {
            method: "DELETE"
        });

        if (response.ok) {
            alert("Activity deleted successfully!");
            loadActivity();
        } else {
            const errorData = await response.json();
            alert(`Failed to delete: ${errorData.message}`);
        }
    } catch (error) {
        console.error("Error deleting activity:", error);
    }
}

</script>


<!-- Two activities cannot have the same date and start_time.

Reject a POST request if another activity already exists with the same date and start time. -->
